name: Validate Scoop Manifests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  validate-manifests:
    name: JSON Schema & SHA-256 Integrity Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Scoop JSON manifests and verify SHA-256 checksums
        run: |
          python3 - <<'PY'
          import glob, hashlib, json, re, sys, urllib.request

          EMPTY_SHA256 = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
          REQUIRED_KEYS = ("version", "description", "homepage", "license", "url", "hash")
          errors = []

          for path in sorted(glob.glob("bucket/*.json")):
              try:
                  manifest = json.load(open(path, encoding="utf-8"))
              except Exception as exc:
                  errors.append(f"{path}: invalid JSON: {exc}")
                  continue

              missing = [k for k in REQUIRED_KEYS if not manifest.get(k)]
              if missing:
                  errors.append(f"{path}: missing required keys: {missing}")
                  continue

              url = manifest["url"]
              raw_hash = str(manifest["hash"]).strip()
              expected = raw_hash.removeprefix("sha256:").lower()
              if not re.fullmatch(r"[0-9a-f]{64}", expected):
                  errors.append(f"{path}: invalid SHA-256 hash '{raw_hash}'")
                  continue
              if expected == EMPTY_SHA256:
                  errors.append(f"{path}: placeholder empty-file SHA-256 detected")
                  continue

              req = urllib.request.Request(url, headers={"User-Agent": "RitualDev-Scoop-CI/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data = resp.read()
                  actual = hashlib.sha256(data).hexdigest()
                  if actual != expected:
                      errors.append(f"{path}: SHA-256 mismatch for {url}\n  expected: {expected}\n  actual:   {actual}")
                  else:
                      print(f"OK {path} v{manifest['version']} ({len(data)} bytes) sha256={actual[:16]}...")
              except Exception as exc:
                  errors.append(f"{path}: failed fetching {url}: {exc}")

          if errors:
              print("\nFAILURES:\n" + "\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print("\nAll Scoop manifests passed schema and SHA-256 verification.")
          PY
